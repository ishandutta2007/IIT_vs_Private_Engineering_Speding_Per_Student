<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#50e3c2;stop-opacity:1" />
      <animate attributeName="x1" values="0%;100%;0%" dur="10s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;0%;100%" dur="10s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <rect width="800" height="200" rx="15" fill="url(#grad1)" />
  <text x="400" y="100" fill="white" font-size="36" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" alignment-baseline="middle">
    Engineering Education Funding
  </text>
  <text x="400" y="140" fill="white" font-size="20" font-family="Arial, sans-serif" text-anchor="middle" alignment-baseline="middle">
    Public vs Private Institutions
  </text>
  <circle cx="100" cy="100" r="40" fill="none" stroke="white" stroke-width="4">
    <animate attributeName="r" values="30;45;30" dur="2s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="700" cy="100" r="40" fill="none" stroke="white" stroke-width="4">
    <animate attributeName="r" values="30;45;30" dur="2s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
